<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Cargojet tracker</title>
  <meta name="theme-color" content="#04070b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304070b'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2300ffc8' stroke-width='2'/%3E%3Cpath d='M10 16h12M16 10v12' stroke='%23ff4d4d' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="/static/tracker.css?v=3" rel="stylesheet">
  <!-- Laddas FÖRE övriga skript så att inget API-anrop hinner passera omätt. -->
  <script src="/static/boot.js?v=3"></script>
</head>
<body>
  <header id="topbar">
    <div id="brand">ATLAS<span> · TRACKER TERMINAL</span></div>

    <div class="tracker-switch">
      <button id="tracker-select" class="tracker-select" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="ts-kicker">MODUL</span>
        <span id="tracker-name">…</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="tracker-menu" class="tracker-menu" role="menu" hidden></div>
    </div>

    <div id="ticker" class="ticker"><span class="dim">Hämtar trackerdata …</span></div>

    <div class="top-right">
      <div id="clock" class="clock"></div>
      <div id="mode-badge" class="mode-badge">
        <span id="live-dot" class="live-dot"></span><span id="live-label">LIVE</span>
        <span id="live-count" class="live-count"></span>
      </div>
      <button id="home-view" class="icon-btn" type="button" aria-label="Återställ vy" title="Återställ vy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="fullscreen" class="icon-btn" type="button" aria-label="Fullskärm" title="Fullskärm" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10V8a5 5 0 0 1 5-5h2M14 3h2a5 5 0 0 1 5 5v2M21 14v2a5 5 0 0 1-5 5h-2M10 21H8a5 5 0 0 1-5-5v-2"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="stage" class="stage">
    <div id="globe" class="globe"></div>
    <div class="hud-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="hud-readout" class="hud-readout"></div>

    <aside id="history-panel" class="panel history-panel">
      <header class="panel-head">
        <h3>HISTORY <span class="head-tag">BACKTEST</span></h3>
        <button id="history-collapse" class="collapse-btn" type="button" aria-label="Fäll ihop">▾</button>
      </header>
      <div class="panel-body">
        <div id="history-summary" class="history-summary"><div class="loadbar"></div></div>
        <div id="history-filters" class="chips"></div>
        <div id="history-list" class="history-list"></div>
      </div>
    </aside>

    <section id="sheet" class="panel sheet">
      <header class="sheet-head"><span class="sheet-title">…</span></header>
      <div class="sheet-body"><div class="loadbar"></div></div>
    </section>

    <aside id="flight-card" class="panel flight-card" hidden></aside>
    <div id="globe-credits" class="globe-credits"></div>
  </main>

  <script src="/static/globe.js?v=3"></script>
  <script src="/static/cargojet.js?v=8"></script>
  <script src="/static/tracker.js?v=5"></script>
</body>
</html>
